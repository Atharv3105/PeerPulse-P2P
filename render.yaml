services:
  - type: web
    name: peerpulse-acie
    runtime: python
    rootDir: acie
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        value: 8001
      - key: PYTHON_VERSION
        value: 3.11.0

  - type: web
    name: peerpulse-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: USE_MOCK
        value: "true"
      - key: ACIE_SERVICE_URL
        fromService:
          type: web
          name: peerpulse-acie
          property: host
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
